<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avertas Robot Service Oy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-orange: #e85324;
      --text-dark: #111111;
      --text-muted: #555555;
      --border-color: #e5e5e5;
      --bg-light: #fafafa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text-dark);
      background-color: #ffffff;
      line-height: 1.4;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-img {
      height: 28px;
      width: auto;
      display: block;
    }

    .logo-text {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--primary-orange);
    }

    .menu-icon {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .menu-icon span {
      display: block;
      width: 22px;
      height: 2.5px;
      background-color: var(--text-dark);
      border-radius: 2px;
    }

    /* Main Hero Content */
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 6rem 1.5rem;
    }

    .hero-image {
      width: 100%;
      height: auto;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      display: block;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }

    .hero-title .highlight {
      color: var(--primary-orange);
      display: inline-block;
      position: relative;
    }

    /* Tekstin hehkuefekti */
    .glow-container {
      position: relative;
      display: inline-block;
    }

    .glow-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 60%;
      background-color: var(--primary-orange);
      opacity: 0.35;
      filter: blur(25px);
      pointer-events: none;
    }

    .hero-description {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-weight: 400;
      line-height: 1.5;
    }

    .hero-description strong {
      color: var(--text-dark);
      font-weight: 700;
    }

    /* Action Buttons */
    .cta-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background-color: var(--primary-orange);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 1rem;
      border-radius: 2px;
      margin-bottom: 1rem;
      transition: background-color 0.2s ease;
    }

    .cta-button:hover {
      background-color: #d04316;
    }

    .phone-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 1rem;
      border-radius: 2px;
    }

    /* Reunassa leijuva ja rullatessa mukana pysyvä päivystysnappi */
    .floating-badge {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      z-index: 1000;
      background: #ffffff;
      border: 2px solid #f8c2b2;
      border-right: none;
      border-radius: 8px 0 0 8px;
      padding: 0.8rem 1rem;
      box-shadow: -4px 4px 12px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: var(--primary-orange);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(232, 83, 36, 0.2);
    }

    .badge-content {
      display: flex;
      flex-direction: column;
    }

    .badge-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .badge-phone {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary-orange);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <!-- Voit vaihtaa logo-kuvan käyttöön poistamalla kommenttimerkit below: -->
      <!-- <img src="logo.png" alt="Avertas Logo" class="logo-img"> -->
      <div class="logo-text">Avertas Robot Service Oy</div>
    </div>
    <div class="menu-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <main>
    <!-- Kuvan lisääminen tekstin yläpuolelle (halutessasi poista kommenttimerkit): -->
    <!-- <img src="kuva.jpg" alt="Avertas robotit" class="hero-image"> -->

    <h1 class="hero-title">
      Pitääkö robottisi
      <span class="glow-container">
        <span class="glow-bg"></span>
        <span class="highlight">tuotantolinjan</span>
      </span>
      liikkeessä?
    </h1>

    <p class="hero-description">
      <strong>Avertas Robot Service Oy</strong> – Teollisuusrobottien ammattitaitoinen huolto ja kunnossapito 40 vuoden kokemuksella.
    </p>

    <a href="#tilaa" class="cta-button">
      Tilaa huolto / Pyydä tarjous &rarr;
    </a>

    <a href="tel:000000000" class="phone-button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      Huoltopäivystys: 0XX XXX XXXX
    </a>
  </main>

  <!-- Oikeassa reunassa leijuva päivystysnappi -->
  <div class="floating-badge">
    <div class="status-dot"></div>
    <div class="badge-content">
      <span class="badge-label">24/7 Päivystys</span>
      <a href="tel:000000000" class="badge-phone">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        0XX XXX XXXX
      </a>
    </div>
  </div>

</body>
</html>
